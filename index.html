<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f2">
<meta name="description" content="Athaa Chatbot — chat dengan berbagai model AI pilihan.">
<title>Athaa Chatbot — by Athaa Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --paper: #fbf9f5;
  --panel: #ffffff;
  --ink: #18181b;
  --muted: #52525b;
  --line: #18181b;
  --accent: #ff7043;
  --accent-hover: #f4511e;
  --accent-light: #ffccbc;
  --accent-ink: #ffffff;
  --lime: #c7f36b;
  --purple: #d9ccff;
  --blue: #c8e8ff;
  --green: #37e8b0;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-sm: 2px 2px 0 var(--ink);
  --r: 16px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: background 0.25s ease, color 0.25s ease;
}
button, textarea, select, input { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

.app {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  max-width: 1500px;
  margin: auto;
}

/* Sidebar */
.sidebar {
  border-right: 3px solid var(--ink);
  padding: 22px 17px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--panel);
  box-shadow: inset -3px 0 0 rgba(0,0,0,0.02);
}

.brand { display: flex; align-items: center; gap: 11px; }
.brandmark {
  width: 42px; height: 42px;
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: var(--shadow-sm);
  display: grid; place-items: center;
  font-size: 20px; font-weight: 900;
}
.brandname { display: block; font-weight: 900; font-size: 18px; letter-spacing: -0.5px; }
.brandby {
  display: block;
  font-size: 10px; font-weight: 800; color: var(--muted);
  letter-spacing: 1px; text-transform: uppercase;
  font-family: 'JetBrains Mono', monospace;
}

.newchat {
  width: 100%; padding: 12px;
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: var(--shadow-sm);
  font-size: 13px; font-weight: 900;
  text-align: left;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
}
.newchat:hover { background: var(--accent-hover); }
.newchat:active, .send:active, .clear:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

.label {
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  font-weight: 900; color: var(--muted); margin: 0 0 8px 4px;
  font-family: 'JetBrains Mono', monospace;
}

.model-list { display: grid; gap: 7px; }
.model {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left; padding: 9px;
  border: 2px solid transparent; border-radius: 12px;
  background: transparent; color: var(--ink);
  font-weight: 700;
  transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
}
.model:hover { background: var(--paper); border-color: var(--ink); transform: translateY(-1px); }
.model.active {
  background: var(--accent-light);
  color: #18181b;
  border: 2px solid var(--ink);
  box-shadow: var(--shadow-sm);
  font-weight: 900;
}
.model.active .model-sub { color: #3f3f46; }

.iconbox {
  width: 34px; height: 34px; flex-shrink: 0;
  display: grid; place-items: center;
  border: 2px solid var(--ink); border-radius: 10px;
  background: var(--panel); color: var(--ink);
  font-size: 11px; font-weight: 900;
}
.model-title { font-size: 12px; font-weight: 900; }
.model-sub { font-size: 10px; color: var(--muted); margin-top: 2px; font-weight: 600; }

/* Akun Google di Sidebar */
.account-box {
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  background: var(--paper);
  padding: 11px;
  box-shadow: var(--shadow-sm);
  display: grid;
  gap: 8px;
}
.account-btn {
  width: 100%;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--panel);
  color: var(--ink);
  padding: 9px 11px;
  font-size: 11px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 2px 2px 0 var(--ink);
}
.account-btn:hover { background: var(--accent-light); color: #18181b; }
.account-btn:active { transform: translate(1px, 1px); box-shadow: none; }

.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
}
.user-avatar {
  width: 34px; height: 34px; border-radius: 10px;
  border: 2px solid var(--ink); object-fit: cover;
  background: var(--blue); color: #18181b;
  display: grid; place-items: center; font-size: 12px; font-weight: 900; flex-shrink: 0;
}
.user-meta { min-width: 0; flex: 1; }
.user-name { font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-email { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'JetBrains Mono', monospace; }

.side-bottom {
  margin-top: auto; border-top: 2px dashed var(--ink); padding-top: 15px; display: grid; gap: 8px;
}
.side-link { font-size: 11px; color: var(--muted); font-weight: 800; padding: 6px 4px; }
.side-link:hover { color: var(--ink); text-decoration: underline; }

/* Main Area */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 100dvh; }

.topbar {
  height: 70px; border-bottom: 3px solid var(--ink);
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 0 27px; background: var(--panel);
  position: sticky; top: 0; z-index: 3;
}
.top-model { display: flex; align-items: center; gap: 10px; font-weight: 900; }
.top-model small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; margin-top: 2px; }

.top-actions { display: flex; align-items: center; gap: 8px; flex
